[build]
  command = "pnpm --filter @threadsponder/dashboard build"
  publish = "packages/dashboard/dist"

[dev]
  command = "pnpm --filter @threadsponder/dashboard dev"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
