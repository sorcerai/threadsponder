<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threadsponder - Coming Soon</title>
  <meta name="description" content="AI-powered reply management for Threads. Automate your responses, deflect haters, and save hours every day.">
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 700px;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .headline {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.1;
    }

    .headline .highlight {
      color: #a855f7;
    }

    .tagline {
      font-size: 1.25rem;
      color: #9ca3af;
      margin-bottom: 2.5rem;
      font-weight: 400;
      line-height: 1.6;
      max-width: 550px;
      margin-left: auto;
      margin-right: auto;
    }

    .coming-soon {
      display: inline-block;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 0.75rem 2rem;
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a855f7;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem;
      color: #6b7280;
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: #fff;
    }

    /* Subtle gradient overlay */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background: radial-gradient(ellipse at top, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
    }

    @media (max-width: 640px) {
      .headline { font-size: 2.5rem; }
      .tagline { font-size: 1rem; }
      .footer {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="container">
    <h1 class="headline">Your Threads. <span class="highlight">Handled.</span></h1>
    <p class="tagline">Automatically respond to hate comments, grow your audience, and never miss an engagement opportunity. AI replies that sound like you.</p>
    <div class="coming-soon">Coming Soon</div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Threadsponder. All rights reserved.</p>
    <div class="footer-links">
      <a href="https://waitlist.threadsponder.com/">Join Waitlist</a>
    </div>
  </footer>
</body>
</html>
