<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threadsponder - Coming Soon</title>
  <meta name="description" content="AI-powered reply management for Threads. Automate your responses, deflect haters, and save hours every day.">
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 1.25rem;
      color: #a0aec0;
      margin-bottom: 3rem;
      font-weight: 400;
    }

    .coming-soon {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.75rem 2rem;
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      backdrop-filter: blur(10px);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .feature {
      padding: 1.5rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s, background 0.2s;
    }

    .feature:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.08);
    }

    .feature-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    .feature-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .cta {
      margin-top: 2rem;
    }

    .cta a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
    }

    .footer {
      margin-top: 4rem;
      color: #4a5568;
      font-size: 0.875rem;
    }

    /* Animated background */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      overflow: hidden;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: radial-gradient(circle at 30% 20%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1.1) rotate(5deg); }
    }

    @media (max-width: 480px) {
      .logo { font-size: 2.25rem; }
      .tagline { font-size: 1rem; }
      .features { grid-template-columns: 1fr 1fr; gap: 1rem; }
      .feature { padding: 1rem 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="container">
    <h1 class="logo">Threadsponder</h1>
    <p class="tagline">AI-powered reply management for Threads</p>

    <div class="coming-soon">Coming Soon</div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-title">Auto Replies</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🛡️</div>
        <div class="feature-title">Deflect Haters</div>
      </div>
      <div class="feature">
        <div class="feature-icon">⏱️</div>
        <div class="feature-title">Save Hours</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🎯</div>
        <div class="feature-title">Your Voice</div>
      </div>
    </div>

    <div class="cta">
      <a href="mailto:hello@threadsponder.com">
        <span>Get Early Access</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

    <div class="footer">
      <p>&copy; 2025 Threadsponder. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
