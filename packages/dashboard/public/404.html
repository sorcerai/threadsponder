<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - Threadsponder</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      background-image: radial-gradient(ellipse at top, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container { text-align: center; padding: 2rem; max-width: 700px; }

    .code {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a855f7;
      margin-bottom: 1rem;
    }

    h1 { font-size: 2.5rem; font-weight: 700; line-height: 1.1; margin-bottom: 1rem; }

    p { font-size: 1.125rem; color: #9ca3af; line-height: 1.6; margin-bottom: 2rem; }

    a {
      display: inline-block;
      background: #a855f7;
      color: #fff;
      padding: 0.875rem 2.25rem;
      border-radius: 100px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    a:hover { background: #9333ea; }
  </style>
</head>
<body>
  <main class="container">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That page does not exist on Threadsponder.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
