# Threadsponder Cloud Build Configuration
# Builds and deploys API and Workers to Cloud Run

# Substitution variables (set in Cloud Build triggers):
# _REGION: Cloud Run region (e.g., us-central1)
# _PROJECT_ID: GCP project ID

steps:
  # ============================================
  # Step 1: Build API Docker image
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/threadsponder-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/threadsponder-api:latest'
      - '-f'
      - 'packages/api/Dockerfile'
      - '.'
    id: 'build-api'

  # ============================================
  # Step 2: Build Workers Docker image
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/threadsponder-workers:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/threadsponder-workers:latest'
      - '-f'
      - 'packages/workers/Dockerfile'
      - '.'
    id: 'build-workers'
    waitFor: ['-'] # Run in parallel with API build

  # ============================================
  # Step 3: Push API image to Container Registry
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/threadsponder-api:$COMMIT_SHA'
    id: 'push-api'
    waitFor: ['build-api']

  # ============================================
  # Step 4: Push Workers image to Container Registry
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/threadsponder-workers:$COMMIT_SHA'
    id: 'push-workers'
    waitFor: ['build-workers']

  # ============================================
  # Step 5: Deploy API to Cloud Run
  # ============================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'threadsponder-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/threadsponder-api:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300s'
      - '--set-env-vars'
      - 'NODE_ENV=production'
    id: 'deploy-api'
    waitFor: ['push-api']

  # ============================================
  # Step 6: Deploy Workers to Cloud Run
  # ============================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'threadsponder-workers'
      - '--image'
      - 'gcr.io/$PROJECT_ID/threadsponder-workers:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'  # Workers triggered by Cloud Scheduler
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--timeout'
      - '3600s'  # 60min for long Gemini API calls
      - '--set-env-vars'
      - 'NODE_ENV=production'
    id: 'deploy-workers'
    waitFor: ['push-workers']

# Push latest tags after successful deploy
images:
  - 'gcr.io/$PROJECT_ID/threadsponder-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/threadsponder-api:latest'
  - 'gcr.io/$PROJECT_ID/threadsponder-workers:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/threadsponder-workers:latest'

# Substitutions (can be overridden in trigger config)
substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Faster builds
