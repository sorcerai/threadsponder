version: '3.8'

services:
  # Local Postgres with pgvector (for development only)
  # In production, use Supabase
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: threadsponder
      POSTGRES_PASSWORD: threadsponder
      POSTGRES_DB: threadsponder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadsponder"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local Redis (for development only)
  # In production, use Upstash
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
